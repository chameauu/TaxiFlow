name: taxiflow

networks:
  taxiflow:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  trino-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  airflow-logs:
  spark-ivy:

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    profiles: ["core"]
    hostname: minio
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET}
      MINIO_SCHEME: http
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    networks: [taxiflow]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio-init:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    profiles: ["core"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    networks: [taxiflow]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy

  postgres:
    image: postgres:15.19
    profiles: ["core", "orchestration", "bi"]
    hostname: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [taxiflow]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  hive-metastore:
    image: starburstdata/hive:3.1.2-e.18
    profiles: ["core"]
    hostname: hive-metastore
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://postgres:5432/${METASTORE_DB}
      HIVE_METASTORE_USER: ${POSTGRES_USER}
      HIVE_METASTORE_PASSWORD: ${POSTGRES_PASSWORD}
      HIVE_METASTORE_WAREHOUSE_DIR: s3://${S3_BUCKET}/warehouse/
      HIVE_METASTORE_USERS_IN_ADMIN_ROLE: admin
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_PATH_STYLE_ACCESS: "true"
      REGION: ""
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
    ports:
      - "9083:9083"
    networks: [taxiflow]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  trino:
    image: trinodb/trino:476
    profiles: ["core"]
    hostname: trino
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8084:8080"
    volumes:
      - ./config/trino/etc:/etc/trino:ro
      - trino-data:/data/trino
    networks: [taxiflow]
    restart: unless-stopped
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    profiles: ["stream"]
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks: [taxiflow]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    profiles: ["stream"]
    hostname: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [taxiflow]
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    profiles: ["stream"]
    hostname: schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    networks: [taxiflow]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  debezium:
    build:
      context: ./docker/debezium
    image: taxiflow/debezium:2.5.1-avro
    profiles: ["stream"]
    hostname: debezium
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: taxiflow-connect
      CONFIG_STORAGE_TOPIC: taxiflow_connect_configs
      OFFSET_STORAGE_TOPIC: taxiflow_connect_offsets
      STATUS_STORAGE_TOPIC: taxiflow_connect_statuses
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_TOPIC_CREATION_ENABLE: "true"
    ports:
      - "8083:8083"
    networks: [taxiflow]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  stream-generator:
    image: postgres:15.19
    profiles: ["stream"]
    entrypoint: ["/bin/bash", "/opt/taxiflow/config/postgres/stream-generator.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TAXIFLOW_EVENT_INTERVAL: ${TAXIFLOW_EVENT_INTERVAL:-5}
    volumes:
      - ./config/postgres/stream-generator.sh:/opt/taxiflow/config/postgres/stream-generator.sh:ro
    networks: [taxiflow]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  spark-stream:
    image: apache/spark:3.5.1
    profiles: ["stream"]
    hostname: spark-stream
    user: root
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - "local[2]"
      - --driver-memory
      - 2g
      - --conf
      - spark.sql.shuffle.partitions=8
      - --packages
      - "${SPARK_STREAM_PACKAGES:-io.delta:delta-spark_2.12:3.1.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.apache.spark:spark-avro_2.12:3.5.1}"
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - /opt/taxiflow/src/taxiflow/jobs/stream_cdc_bronze.py
    environment:
      SPARK_NO_DAEMONIZE: "true"
      PYTHONPATH: /opt/taxiflow/src
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3A_ENDPOINT: http://minio:9000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./:/opt/taxiflow:ro
      - spark-ivy:/tmp/.ivy2
    networks: [taxiflow]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      minio:
        condition: service_healthy

  airflow-init:
    image: apache/airflow:2.9.3-python3.11
    profiles: ["orchestration"]
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - "mkdir -p /opt/airflow/logs && chown -R 50000:0 /opt/airflow/logs"
    volumes:
      - airflow-logs:/opt/airflow/logs
    networks: [taxiflow]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    image: apache/airflow:2.9.3-python3.11
    profiles: ["orchestration"]
    hostname: airflow
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
    networks: [taxiflow]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 24
      start_period: 45s

  superset-init:
    image: taxiflow/superset:4.1.1
    build:
      context: ./docker/superset
    profiles: ["bi"]
    command:
      - /bin/sh
      - -c
      - "superset db upgrade && superset init"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${SUPERSET_DB}
    volumes:
      - ./config/superset_config.py:/app/pythonpath/superset_config.py:ro
    networks: [taxiflow]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  superset:
    image: taxiflow/superset:4.1.1
    build:
      context: ./docker/superset
    profiles: ["bi"]
    hostname: superset
    command:
      - gunicorn
      - --bind
      - "0.0.0.0:8088"
      - --workers
      - "2"
      - --timeout
      - "120"
      - "superset.app:create_app()"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${SUPERSET_DB}
    ports:
      - "8088:8088"
    volumes:
      - ./config/superset_config.py:/app/pythonpath/superset_config.py:ro
    networks: [taxiflow]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 24
      start_period: 30s

  spark:
    image: apache/spark:3.5.1
    profiles: ["batch"]
    hostname: spark
    command: ["sleep", "infinity"]
    user: root
    environment:
      SPARK_NO_DAEMONIZE: "true"
      PYTHONPATH: /opt/taxiflow/src
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3A_ENDPOINT: http://minio:9000
    volumes:
      - ./:/opt/taxiflow:ro
      - spark-ivy:/tmp/.ivy2
    networks: [taxiflow]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "spark-submit --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
