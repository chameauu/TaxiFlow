name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Sync locked environment
        run: uv sync --frozen --group quality

      - name: Create local environment
        run: make env

      - name: Verify
        run: make verify
