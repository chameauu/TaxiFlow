version: 2

sources:
  - name: bronze
    description: Delta bronze written by the Spark batch and CDC jobs.
    database: "{{ env_var('TRINO_CATALOG', 'delta') }}"
    schema: "{{ env_var('TRINO_BRONZE_SCHEMA', 'default') }}"
    tables:
      - name: tlc_trips
        description: One row per accepted TLC trip, with provenance and deterministic trip_id.
        columns:
          - name: trip_id
            description: Deterministic identity derived from source provenance and row content.
          - name: tpep_pickup_datetime
            description: Source wall-clock pickup timestamp preserved in bronze.
          - name: ingested_at
            description: Batch ingest timestamp.
      - name: tlc_quarantine
        description: Rejected TLC rows with a reason and raw JSON payload.
        columns:
          - name: quarantine_id
            description: Deterministic identity for the rejected row and reason.
          - name: quarantine_reason
            description: Contract reason the row was rejected.
      - name: cdc_taxi_trips
        description: Latest-state CDC events from iot.taxi_nyc_time_series, one row per Debezium event.
        columns:
          - name: trip_id
            description: Source-owned identity; stable across updates and deletes.
          - name: __op
            description: Debezium operation (c, r, u, d).
          - name: __source_ts_ms
            description: Debezium source epoch millis; the event ordering and freshness clock.
          - name: pickup_datetime
            description: Pickup as epoch millis; naive iot timestamps are UTC wall clock.
